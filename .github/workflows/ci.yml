name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v6

    - name: Print toolchain
      run: swift --version && xcodebuild -version

    - name: Build
      run: swift build -c release

    - name: Run Tests
      run: |
        if [ -f ./scripts/ci-test.sh ]; then
          ./scripts/ci-test.sh
        else
          swift test
        fi

    - name: Check Code Style
      run: |
        # Basic checks
        find Sources -name "*.swift" -exec grep -H "TODO" {} \; || true
        find Sources -name "*.swift" -exec grep -H "FIXME" {} \; || true
