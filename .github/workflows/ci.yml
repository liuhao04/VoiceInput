name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v6

    - name: Print toolchain
      run: swift --version && xcodebuild -version

    - name: Build
      run: swift build -c release

    - name: Run Live ASR Protocol Test
      env:
        VOLC_APP_ID: ${{ secrets.VOLC_APP_ID }}
        VOLC_ACCESS_TOKEN: ${{ secrets.VOLC_ACCESS_TOKEN }}
        VOLC_BOOSTING_TABLE_ID: ${{ secrets.VOLC_BOOSTING_TABLE_ID }}
      run: |
        if [ -n "${VOLC_APP_ID:-}" ] && [ -n "${VOLC_ACCESS_TOKEN:-}" ]; then
          ./scripts/ci-test.sh --asr-only
        else
          echo "::warning::VOLC_APP_ID/VOLC_ACCESS_TOKEN secrets are not configured. Skipping live ASR protocol test."
        fi

    - name: Check Code Style
      run: |
        # Basic checks
        find Sources -name "*.swift" -exec grep -H "TODO" {} \; || true
        find Sources -name "*.swift" -exec grep -H "FIXME" {} \; || true
